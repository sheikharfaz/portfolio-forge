name: Nightly template verification

# The promise this project makes is that a generated site always works. That is
# only true if template rot is found here, by us, rather than by a stranger
# whose published site broke. Dependency drift is the usual cause, so this runs
# whether or not anyone pushed.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find.outputs.templates }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          list=$(find templates -mindepth 2 -maxdepth 2 -name template.json -printf '%h\n' | jq -R . | jq -sc .)
          echo "templates=$list" >> "$GITHUB_OUTPUT"
          [ "$list" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.templates) }}
        fixture: [sparse, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: harness
      - run: npx playwright install --with-deps chromium
        working-directory: harness
      - run: node harness/verify.mjs --template "${{ matrix.template }}" --fixture "schema/fixtures/${{ matrix.fixture }}.json"


  stage:
    name: ${{ matrix.template }} stages standalone
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The harness verifies the template plus a profile. This verifies what
      # the user actually receives: a standalone repo, no Forge tooling, built
      # the way the shipped workflow builds it.
      - run: node scripts/smoke-stage.mjs --template "${{ matrix.template }}" --fixture schema/fixtures/full.json
      - run: node scripts/smoke-stage.mjs --template "${{ matrix.template }}" --fixture schema/fixtures/sparse.json

  report:
    needs: [verify, stage]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly verification failed';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly-failure',
            });
            const body = `The nightly template verification run failed.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `A template that fails here will fail for users. Treat it as broken until this is green.`;
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly-failure'],
              });
            }
