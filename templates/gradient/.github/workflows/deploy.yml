# Ships with the generated site, not with Portfolio Forge itself.
# GitHub only reads workflows from a repository's root .github/workflows, so
# this file is inert here and live once the site is published.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it; a half-applied
# Pages deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A project site is served from /<repo>/. Building for / produces a blank
      # unstyled page, so the base path is derived from the repo name — unless
      # this is a user site (<login>.github.io), which is served from /.
      - name: Resolve base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${GITHUB_REPOSITORY%%/*}.github.io" ]; then
            echo "FORGE_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "FORGE_BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
